<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        :root {
            /* Color Palette */
            --bg-primary: #0a0a0a;
            --bg-secondary: #151515;
            --bg-tertiary: #1f1f1f;
            --bg-hover: #2a2a2a;
            --border-color: #2d2d2d;
            --border-hover: #404040;

            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-tertiary: #707070;

            --accent-primary: #4a9eff;
            --accent-hover: #6db0ff;
            --accent-subtle: #1a3d5f;

            /* Spacing System */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;
            --space-2xl: 32px;

            /* Typography */
            --font-size-xs: 11px;
            --font-size-sm: 13px;
            --font-size-md: 14px;
            --font-size-lg: 16px;
            --font-size-xl: 20px;

            /* Layout */
            --border-radius-sm: 4px;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --max-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: var(--space-2xl) var(--space-lg);
            line-height: 1.5;
        }

        /* ============================================
           SEARCH SECTION
        ============================================ */

        .search-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto var(--space-2xl);
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: var(--space-md) var(--space-lg);
            font-size: var(--font-size-lg);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            color: var(--text-primary);
            outline: none;
            font-family: inherit;
        }

        .search-box:focus {
            border-color: var(--accent-primary);
            background: var(--bg-tertiary);
        }

        .search-box::placeholder {
            color: var(--text-tertiary);
        }

        .suggestions {
            position: absolute;
            top: calc(100% + var(--space-sm));
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }

        .suggestions.active {
            display: block;
        }

        .suggestion-item {
            padding: var(--space-md) var(--space-lg);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--space-md);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover,
        .suggestion-item.selected {
            background: var(--bg-hover);
        }

        .suggestion-item.selected {
            border-left: 2px solid var(--accent-primary);
        }

        .suggestion-icon {
            width: 16px;
            height: 16px;
            opacity: 0.7;
            flex-shrink: 0;
            color: var(--text-secondary);
        }

        .suggestion-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: var(--font-size-md);
        }

        /* ============================================
           BOOKMARKS SECTION
        ============================================ */

        .bookmarks-wrapper {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .section-header {
            margin-bottom: var(--space-xl);
        }

        .section-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: var(--space-xs);
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            cursor: pointer;
            color: var(--accent-primary);
        }

        .breadcrumb-item:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .breadcrumb-separator {
            color: var(--text-tertiary);
            user-select: none;
        }

        .manage-note {
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
            cursor: pointer;
            user-select: none;
            display: inline-block;
        }

        .manage-note:hover {
            color: var(--text-secondary);
        }

        .manage-note:active {
            color: var(--accent-primary);
        }

        /* ============================================
           NOTES (LIGHTWEIGHT)
        ============================================ */

        .notes {
            margin-top: var(--space-2xl);
            padding: var(--space-md);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
        }

        .notes-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-md);
            margin-bottom: var(--space-sm);
        }

        .notes-title {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .notes-actions {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            min-height: 20px;
        }

        .notes-status {
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        .notes-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--border-radius-sm);
            padding: 4px 8px;
            font-size: var(--font-size-xs);
            cursor: pointer;
        }

        .notes-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .notes-area {
            width: 100%;
            min-height: 120px;
            max-height: 260px;
            resize: none;
            overflow-y: hidden;
            padding: var(--space-md);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            color: var(--text-primary);
            font-size: var(--font-size-md);
            line-height: 1.5;
            outline: none;
            font-family: inherit;
        }

        .notes-area:focus {
            border-color: var(--accent-primary);
        }

        .notes-area::placeholder {
            color: var(--text-tertiary);
        }

        /* ============================================
           BOOKMARKS GRID
        ============================================ */

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: var(--space-md);
        }

        .bookmark-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg) var(--space-sm);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
            aspect-ratio: 1 / 1;
            min-height: 110px;
        }

        .bookmark-item:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-hover);
        }

        .bookmark-item:focus {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .bookmark-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius-sm);
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-sm);
            flex-shrink: 0;
        }

        .bookmark-favicon {
            width: 32px;
            height: 32px;
            display: block;
        }

        .bookmark-letter {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .bookmark-title {
            font-size: var(--font-size-sm);
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            width: 100%;
            line-height: 1.3;
            word-break: break-word;
        }

        /* Folder specific styles */
        .bookmark-item[data-folder-id] .bookmark-icon {
            background: var(--accent-subtle);
        }

        .bookmark-item[data-folder-id]:hover .bookmark-icon {
            background: var(--accent-hover);
        }

        /* ============================================
           UTILITIES
        ============================================ */

        .empty-state {
            text-align: center;
            padding: var(--space-2xl) var(--space-lg);
            color: var(--text-tertiary);
            font-size: var(--font-size-md);
            grid-column: 1 / -1;
        }

        .copy-notification {
            position: fixed;
            bottom: var(--space-xl);
            right: var(--space-xl);
            background: var(--bg-secondary);
            border: 1px solid var(--accent-primary);
            border-radius: var(--border-radius-md);
            padding: var(--space-md) var(--space-lg);
            color: var(--accent-primary);
            font-size: var(--font-size-sm);
            opacity: 0;
            pointer-events: none;
        }

        .copy-notification.show {
            opacity: 1;
        }

        /* ============================================
           SCROLLBAR
        ============================================ */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-hover);
            border-radius: var(--border-radius-sm);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* ============================================
           RESPONSIVE DESIGN
        ============================================ */

        @media (max-width: 768px) {
            body {
                padding: var(--space-lg) var(--space-md);
            }

            .search-container {
                margin-bottom: var(--space-xl);
            }

            .bookmarks-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: var(--space-sm);
            }

            .bookmark-item {
                padding: var(--space-md) var(--space-xs);
                min-height: 95px;
            }

            .bookmark-icon {
                width: 40px;
                height: 40px;
            }

            .bookmark-favicon {
                width: 28px;
                height: 28px;
            }

            .bookmark-letter {
                font-size: 20px;
            }

            .section-title {
                font-size: var(--font-size-lg);
            }

            .copy-notification {
                bottom: var(--space-md);
                right: var(--space-md);
                left: var(--space-md);
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .bookmarks-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .bookmark-title {
                font-size: var(--font-size-xs);
            }
        }

        @media (min-width: 1400px) {
            .bookmarks-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }

        /* ============================================
           PRINT STYLES
        ============================================ */

        @media print {
            .search-container,
            .manage-note,
            .copy-notification,
            .notes {
                display: none;
            }

            body {
                background: white;
                color: black;
            }
        }

        /* ============================================
           ACCESSIBILITY
        ============================================ */

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Focus visible for keyboard navigation */
        *:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            :root {
                --border-color: #505050;
                --text-secondary: #c0c0c0;
            }
        }
    </style>
</head>
<body>
    <div class="search-container">
        <input
            type="text"
            class="search-box"
            placeholder="Search bookmarks or web..."
            autocomplete="off"
            id="searchInput"
            autofocus
            aria-label="Search bookmarks or Google"
            aria-autocomplete="list"
            aria-controls="suggestions"
            spellcheck="false">
        <div class="suggestions" id="suggestions" role="listbox"></div>
    </div>

    <div class="bookmarks-wrapper">
        <div class="section-header">
            <h1 class="section-title">Bookmarks</h1>
            <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb navigation"></nav>
            <div class="manage-note" id="manageNote" role="button" tabindex="0" aria-label="Copy bookmarks management URL">
                Type "chrome://bookmarks/" to manage
            </div>
        </div>

        <div class="bookmarks-grid" id="bookmarksGrid" role="grid">
            <div class="empty-state">Loading bookmarks...</div>
        </div>

        <!-- Notes (minimal, fast) - below bookmarks -->
        <section class="notes" aria-label="Notes">
            <div class="notes-header">
                <div class="notes-title">Notes</div>
                <div class="notes-actions">
                    <span class="notes-status" id="notesStatus" aria-live="polite"></span>
                    <button class="notes-btn" id="notesClearBtn" type="button" aria-label="Clear notes">Clear</button>
                </div>
            </div>
            <textarea
                class="notes-area"
                id="notesArea"
                placeholder="Quick notes… (autosaves)"
                spellcheck="false"></textarea>
        </section>
    </div>

    <div class="copy-notification" id="copyNotification" role="alert" aria-live="polite">
        Copied to clipboard!
    </div>

    <script src="homepage.js"></script>
</body>
</html>
