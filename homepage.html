<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="homepage.css" />
</head>
<body>
  <div class="search-container">
    <input
      type="text"
      class="search-box"
      placeholder="Search bookmarks or web..."
      autocomplete="off"
      id="searchInput"
      autofocus
      aria-label="Search bookmarks or Google"
      aria-autocomplete="list"
      aria-controls="suggestions"
      aria-expanded="false"
      spellcheck="false"
    />
    <div class="suggestions" id="suggestions" role="listbox"></div>
  </div>

  <div class="bookmarks-wrapper">
    <div class="section-header">
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb navigation"></nav>
    </div>

    <div class="bookmarks-grid" id="bookmarksGrid" role="grid">
      <div class="empty-state">Loading bookmarks...</div>
    </div>

    <section class="notes" aria-label="Notes">
      <div class="notes-header">
        <div class="notes-tabs" id="notesTabs" role="tablist" aria-label="Notes tabs"></div>
        <div class="notes-divider" aria-hidden="true"></div>
        <div class="notes-actions">
          <span class="notes-status" id="notesStatus" aria-live="polite"></span>
          <button class="notes-btn" id="notesUndoBtn" type="button" aria-label="Undo delete" style="display:none">
            Undo
          </button>
          <button class="notes-btn notes-move-btn" id="notesMoveLeftBtn" type="button" aria-label="Move note left" title="Move note left (Alt+Left)">
            ◀
          </button>
          <button class="notes-btn notes-move-btn" id="notesMoveRightBtn" type="button" aria-label="Move note right" title="Move note right (Alt+Right)">
            ▶
          </button>
          <button class="notes-btn" id="notesExportBtn" type="button" aria-label="Export notes">
            Export
          </button>
          <button class="notes-btn" id="notesImportBtn" type="button" aria-label="Import notes">
            Import
          </button>
          <input type="file" id="notesImportFile" accept="application/json" style="display:none" />
          <button class="notes-btn" id="notesNewBtn" type="button" aria-label="New note">
            New
          </button>
          <button class="notes-btn" id="notesDeleteBtn" type="button" aria-label="Delete current note">
            Delete
          </button>
          <button class="notes-btn" id="notesClearBtn" type="button" aria-label="Clear current note">
            Clear
          </button>
        </div>
      </div>

      <textarea
        class="notes-area"
        id="notesArea"
        placeholder="Quick notes… (autosaves)"
        spellcheck="false"
      ></textarea>
    </section>
  </div>

  <div class="copy-notification" id="copyNotification" role="alert" aria-live="polite">
    Copied to clipboard!
  </div>

  <button class="info-btn" id="infoBtn" aria-label="Bookmark Info" title="Where are these shortcuts from?">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="7"></circle><line x1="8" y1="11" x2="8" y2="8"></line><line x1="8" y1="5" x2="8.01" y2="5"></line></svg>
  </button>

  <div class="info-panel" id="infoPanel" role="status">
    Shortcuts are browser bookmarks. To edit them, go to <span class="chrome-link" id="bookmarksLink">chrome://bookmarks</span>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
